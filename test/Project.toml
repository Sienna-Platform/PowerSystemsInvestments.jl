# The test environment is the active/root project when running `julia --project=test`,
# so it must declare the same psy6/IS4 transitive pins as the package Project.toml.
PowerSystemsInvestments = {path = ".."}
InfrastructureSystems = {url = "https://github.com/Sienna-Platform/InfrastructureSystems.jl.git", rev = "IS4"}

[sources]
# Without this the test environment resolves the REGISTERED PowerSystemsInvestments-
# Portfolios instead of the working tree, so local changes are never exercised and the
# registered package's own compat bounds drive resolution.
PowerSystemsInvestmentsPortfolios = {url = "https://github.com/Sienna-Platform/InfrastructureSystems.jl.git", rev = "psy6"}
InfrastructureSystems = {url = "https://github.com/Sienna-Platform/InfrastructureSystems.jl.git", rev = "IS4"}
PowerSystems = {url = "https://github.com/Sienna-Platform/PowerSystems.jl.git", rev = "psy6"}
# Branch pins until the OpenAPI packages are registered and the psy6-line branches merge.
# PowerOperationsOpenAPIModels is unused by PSIP itself and listed only so Pkg can resolve
# PowerSystems.
PowerCoreOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "main", subdir = "PowerCoreOpenAPIModels.jl"}
InfrastructureCoreOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "main", subdir = "InfrastructureCoreOpenAPIModels.jl"}
InfrastructureTimeSeriesOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "main", subdir = "InfrastructureTimeSeriesOpenAPIModels.jl"}

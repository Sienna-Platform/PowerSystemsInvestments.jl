[sources]
# Local/branch checkouts required for the psy6 compatibility work.
# PSIP psy6 pins PowerSystems->psy6 and InfrastructureSystems->IS4. Julia only honors
# [sources] in the active/root project, so these transitive pins must be declared here.
# The OpenAPI model packages PSIP uses are registered; only PowerInvestmentsOpenAPIModels
# is pinned, to the branch with per-technology financial rates, until the schema release.
# InfrastructureSystems: the IS4 tip (matches PSIP's and IOM's own [sources]); needs the
# registered InfraStore (Rust-backed wrapper) resolved from the General registry.
InfrastructureSystems = {url = "https://github.com/Sienna-Platform/InfrastructureSystems.jl.git", rev = "IS4"}
InfrastructureOptimizationModels = {url = "https://github.com/Sienna-Platform/InfrastructureOptimizationModels.jl.git", rev = "main"}
# PowerSystems: git psy6 rev (matches PSIP's own pin); the local checkout is stale vs the IS4 tip.
PowerSystems = {url = "https://github.com/Sienna-Platform/PowerSystems.jl.git", rev = "psy6"}
PowerSystemsInvestmentsPortfolios = {path = "../PowerSystemsInvestmentsPortfolios.jl"}
PowerInvestmentsOpenAPIModels = {url = "https://github.com/Sienna-Platform/PowerOpenAPIModels.git", rev = "rh/remove-portfolio-financial-data", subdir = "PowerInvestmentsOpenAPIModels.jl"}

